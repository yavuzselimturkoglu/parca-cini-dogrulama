<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Parça Cini - E-posta Doğrulandı</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border-radius:24px;padding:36px;box-shadow:0 18px 60px rgba(0,0,0,.10);text-align:center}
    .logo{font-size:30px;font-weight:800;letter-spacing:.2px;margin-bottom:18px}
    .check{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:#ecfdf5;font-size:42px}
    h1{font-size:26px;margin:0 0 12px}
    p{font-size:16px;line-height:1.6;margin:0 0 24px;color:#4b5563}
    .btn{display:inline-block;width:100%;padding:15px 20px;border-radius:14px;background:#111827;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
    .note{margin-top:18px;font-size:13px;color:#6b7280}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Parça Cini</div>
    <div class="check">✓</div>
    <h1>E-posta adresiniz doğrulandı</h1>
    <p>Hesabınız başarıyla doğrulandı. Parça Cini uygulamasına dönerek giriş yapabilirsiniz.</p>
    <a class="btn" href="parcaciniapp://auth/callback">Parça Cini'yi Aç</a>
    <div class="note">Uygulama bu cihazda kurulu değilse bu sayfayı kapatıp Parça Cini'yi açabilirsiniz.</div>
  </main>
</body>
</html>
